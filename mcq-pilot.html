<!doctype html><html lang="en-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow, noarchive"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://esm.sh; style-src 'unsafe-inline'; connect-src https://esm.sh https://uxnqoglkqptnslsdowxn.supabase.co; base-uri 'none'; form-action 'none'"><title>NeoClinIQ | Private MCQ pilot</title><style>body{font:17px/1.55 system-ui;margin:0;background:#f0f7f6;color:#132e41}main{max-width:42rem;margin:8vh auto;padding:1.8rem;box-sizing:border-box;background:white;border:1px solid #c3d9d7;border-radius:16px}a{color:#075f58}h1{line-height:1.15}small{font-weight:bold;color:#086c63}label{display:block;padding:.36rem}button{background:#086c63;color:white;border:0;border-radius:6px;padding:.6rem 1rem;cursor:pointer}#result{font-weight:bold}@media(max-width:700px){main{margin:1rem}}</style></head><body><main><small>NEOCLINIQ · AUTHORIZED QA ONLY</small><h1>Private MCQ pilot</h1><p>This access check uses a sample question. The 200-question mock is not available here.</p><p id="status" aria-live="polite">Checking access…</p><div id="sample" hidden><form id="quiz"><fieldset><legend id="stem"></legend><div id="options"></div></fieldset><p><button>Check sample answer</button></p></form><p id="result" aria-live="polite"></p></div><p><a href="/learning.html">Back to the Learning Portal</a></p></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const base='https://uxnqoglkqptnslsdowxn.supabase.co',key='sb_publishable_v0uOpwZ-BBas2E7jyDkMXQ_TzNOHdAA';
const client=createClient(base,key),$=s=>document.getElementById(s);let seq=0;
function clear(){ $('sample').hidden=true;$('stem').textContent='';$('options').replaceChildren();$('result').textContent='' }
async function check(session){const n=++seq;clear();if(!session){$('status').textContent='Sign in to the Learning Portal to continue.';return}
try{const res=await fetch(base+'/functions/v1/website-mcq-pilot-check',{headers:{Authorization:'Bearer '+session.access_token,apikey:key},cache:'no-store',signal:AbortSignal.timeout(15000)});if(n!==seq)return;if(!res.ok){$('status').textContent='This pilot is not available to this account.';return}const v=await res.json();if(n!==seq)return;if(v.state!=='pilot'||!Array.isArray(v.sample?.choices)||v.sample.choices.length!==4)throw Error();$('status').textContent='Authorized paid MCQ test account verified.';$('stem').textContent=v.sample.stem;
for(const choice of v.sample.choices){const label=document.createElement('label'),x=document.createElement('input');x.type='radio';x.name='answer';x.value=choice;x.required=true;label.append(x,' '+choice);$('options').append(label)}$('sample').hidden=false;}catch{if(n===seq)$('status').textContent='Could not verify this pilot.'}}
client.auth.onAuthStateChange((_event,session)=>{setTimeout(()=>check(session),0)});
$('quiz').addEventListener('submit',e=>{e.preventDefault();const a=new FormData(e.currentTarget).get('answer');$('result').textContent=a==='20'?'Correct: 100 ÷ 5 = 20.':'Not quite: 100 ÷ 5 = 20.'});
addEventListener('pagehide',()=>{seq++;clear()});
addEventListener('pageshow',event=>{if(event.persisted)client.auth.getSession().then(({data})=>check(data.session))});
</script></body></html>
