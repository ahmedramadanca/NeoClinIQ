name: Private reference PDF ingestion
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum pending PDFs to process (0 = all)"
        required: true
        default: "5"
        type: string
      workers:
        description: "Concurrent workers (start with 2, then increase)"
        required: true
        default: "2"
        type: string
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.NEOCLINIQ_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NEOCLINIQ_SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_ACCESS_TOKEN: ${{ secrets.NEOCLINIQ_GOOGLE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check required credentials
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY" && exit 1)
          test -n "$GOOGLE_ACCESS_TOKEN" || (echo "Missing GOOGLE_ACCESS_TOKEN" && exit 1)
      - name: Install pinned PDF and HTTP dependencies
        run: python -m pip install 'requests==2.32.3' 'PyMuPDF==1.25.5'
      - name: Ingest pending reference documents
        run: python scripts/ingest_references.py --workers "${{ inputs.workers }}" --limit "${{ inputs.limit }}"
