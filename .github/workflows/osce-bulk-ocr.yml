name: OSCE bulk OCR indexing
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/osce_bulk_ocr.py'
      - '.github/workflows/osce-bulk-ocr.yml'
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: read
concurrency:
  group: osce-ocr
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - name: Install OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr poppler-utils
          python -m pip install --disable-pip-version-check requests pymupdf pytesseract pillow supabase
      - name: OCR OSCE PDFs and persist index
        env:
          SUPABASE_URL: https://uxnqoglkqptnslsdowxn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/osce_bulk_ocr.py
