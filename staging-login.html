<!doctype html><html lang="en-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>NeoClinIQ | Sandbox Student Login</title><style>body{font:16px/1.5 system-ui,Arial;background:#f1f7fa;color:#12364a;margin:0}main{max-width:540px;margin:7vh auto;padding:26px;background:white;border-radius:18px;box-shadow:0 10px 40px #092e4c19}h1{color:#082e50}label{display:block;margin:14px 0 5px}input,button{width:100%;padding:12px;font:inherit;border-radius:8px;box-sizing:border-box}input{border:1px solid #a6bdc9}button{margin-top:18px;background:#087f86;color:white;border:0;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.note{background:#fff3d7;padding:12px;border-radius:8px}#status{white-space:pre-wrap}a{color:#087f86}</style></head><body><main><h1>NeoClinIQ — Sandbox Login</h1><p class="note"><strong>TEST ENVIRONMENT ONLY.</strong> No real payment will be collected. This page signs in to NeoClinIQ-Staging, not the production student portal.</p><form id="login"><label for="email">Staging student email</label><input id="email" type="email" autocomplete="username" required><label for="password">Staging student password</label><input id="password" type="password" autocomplete="current-password" required><button id="signIn">Sign in to staging</button></form><section id="signed" hidden><p id="identity"></p><button id="checkout">Start CAD $1,500 sandbox MCQ checkout</button><button id="logout" type="button">Sign out</button></section><p id="status" role="status" aria-live="polite"></p><p><a href="https://supabase.com/dashboard/project/aflbijopgdiewczhtvzf/auth/users">Staging user management</a></p></main><script type="module">import{createClient}from"https://esm.sh/@supabase/supabase-js@2.49.8";const client=createClient("https://aflbijopgdiewczhtvzf.supabase.co","sb_publishable_aT0arSgJqDm9040EUM5Thg_Yqi59C6a",{auth:{persistSession:false,autoRefreshToken:true,detectSessionInUrl:false}});const $=id=>document.getElementById(id),status=s=>$("status").textContent=s;let accessToken=null;const show=user=>{$("login").hidden=!!user;$("signed").hidden=!user;$("identity").textContent=user?"Signed in: "+user.email:"";};$("login").addEventListener("submit",async e=>{e.preventDefault();$("signIn").disabled=true;status("Signing in...");try{const{data,error}=await client.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});$("password").value="";if(error)throw error;accessToken=data.session?.access_token;if(!accessToken)throw Error("No session returned");show(data.user);status("Staging login successful. You may start a sandbox checkout.");}catch(err){status("Sign-in failed: "+err.message);}finally{$("signIn").disabled=false;}});$("checkout").addEventListener("click",async()=>{if(!accessToken)return status("Sign in first.");$("checkout").disabled=true;status("Creating Stripe sandbox checkout...");try{const res=await fetch("https://aflbijopgdiewczhtvzf.supabase.co/functions/v1/website-create-checkout",{method:"POST",headers:{"authorization":"Bearer "+accessToken,"apikey":"sb_publishable_aT0arSgJqDm9040EUM5Thg_Yqi59C6a","content-type":"application/json"},body:JSON.stringify({program:"mcq",purchaseType:"initial"})});const data=await res.json();if(!res.ok)throw Error(data.error||"Checkout unavailable");if(typeof data.url!=="string"||!data.url.startsWith("https://checkout.stripe.com/"))throw Error("Unexpected checkout URL");location.assign(data.url);}catch(err){status("Checkout error: "+err.message);$("checkout").disabled=false;}});$("logout").addEventListener("click",async()=>{await client.auth.signOut();accessToken=null;show(null);status("Signed out.");});show(null);</script></body></html>
